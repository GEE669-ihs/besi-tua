{% extends "base.html" %}
{% block judul %}{{ judul }}{% endblock %}
{% block konten %}
<h1 class="judul-halaman">{{ judul }}</h1>
<form method="post" class="kartu-form" novalidate>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
  <div class="isian">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="bantuan">{{ field.help_text }}</small>{% endif %}
    {{ field.errors }}
  </div>
  {% endfor %}
  <div class="aksi">
    <button type="submit" class="tombol">Simpan</button>
    <a class="tombol sekunder" href="{% url batal %}">Batal</a>
  </div>
</form>
{% endblock %}
